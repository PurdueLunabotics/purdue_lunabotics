name: Light Continuous Integration Tests

on:
  push:

jobs:
  run-build:
    name: Make sure the code builds
    runs-on: ubuntu-latest
    container: ghcr.io/purduelunabotics/development:latest

    steps:
      - name: Pull code
        shell: bash
        run: cd /luna_ws/src/purdue_lunabotics && git fetch && git checkout ${{ github.sha }} 
      - name: Install any new deps
        shell: bash
        run: rosdep update && rosdep install -r --from-paths /luna_ws/src --ignore-src --rosdistro jazzy -y
      - name: Add matcher
        run: |
          cp /luna_ws/src/purdue_lunabotics/.github/matchers/gcc.json "$HOME/gcc.json"
          echo "::add-matcher::$HOME/gcc.json"
      - name: Test building
        shell: bash
        run: cd /luna_ws/ && source /opt/ros/jazzy/setup.bash && colcon build
