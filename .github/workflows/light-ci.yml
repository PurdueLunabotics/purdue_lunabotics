name: Light Continuous Integration Tests

on:
  push:

jobs:
  run-build:
    name: Make sure the code builds
    runs-on: ubuntu-latest
    container: ghcr.io/purduelunabotics/development:latest

    steps:
      - name: Install any new deps
        run: rosdep install -r --from-paths /luna_ws/src --ignore-src --rosdistro jazzy -y
      - name: Test building
        shell: bash
        run: cd /luna_ws/ && source /opt/ros/jazzy/setup.bash && colcon build
