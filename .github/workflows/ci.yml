name: Continuous Integration Tests

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
  pull_request:
    branches:
      - master 
      - develop  

jobs:
  build-container:
    name: Build the devcontainer
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/purduelunabotics/development:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-build:
    name: Make sure the code builds
    needs: build-container
    runs-on: ubuntu-latest
    container: ghcr.io/purduelunabotics/development:latest

    steps:
      - name: Test building
        shell: bash
        run: cd /luna_ws/ && source /opt/ros/humble/setup.bash && colcon build
