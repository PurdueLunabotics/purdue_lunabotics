point_to_point_node:
  ros__parameters:
    frequency: 60.0
    angular:
      p: 5.0
      i: 0.0
      d: 0.0
      max_output: 0.349
      tolerance: 10.0
    linear:
      p: 3.0
      i: 0.0
      d: 0.0
      max_output: 0.15
      tolerance: 0.2

differential_drive_controller_node:
  ros__parameters:
    gearbox_ratio: 50.0
    hz: 20.0
    max_speed: 3000
    max_speed_percentage: 0.8
    wheel_diameter: 0.3429
    width: 0.5588
    pwm_to_velocity_factor: 3.5

drivetrain_controller_node:
  ros__parameters:
    gearbox_ratio: 50.0
    do_excavation: true


mini:
  point_to_point_node:
    ros__parameters:
      frequency: 60.0
      angular:
        p: 5.0
        i: 0.0
        d: 0.0
        max_output: 0.3
        tolerance: 10.0
      linear:
        p: 3.0
        i: 0.0
        d: 0.0
        max_output: 0.25
        tolerance: 0.2

  differential_drive_controller_node:
    ros__parameters:
      gearbox_ratio: 10.0
      hz: 20.0
      max_speed: 3000
      max_speed_percentage: 0.8
      wheel_diameter: 0.0528
      width: 0.5588
      pwm_to_velocity_factor: 1.0

  drivetrain_controller_node:
    ros__parameters:
      gearbox_ratio: 10.0
      do_excavation: false


controller_server:
    ros__parameters:
      controller_plugins: ["FollowPath"]
      
      FollowPath:
        plugin: "custom_mppi_controller::CustomMPPIController"

        vx_max: 0.5
        vx_min: -0.5
        wz_max: .572665
        wz_min: -.572665

        vx_std: 3.0
        wz_std: 3.0

        # These shou
        regenerate_noises: true
        open_loop: true

        batch_size: 3000
        iteration_count: 3

        visualize: true
        TrajectoryVisualizer:
          trajectory_step: 50
          time_step: 5

        critics:
          - CustomCritic
          # - GoalAngleCritic
          # - ObstaclesCriticls
          # - PathAlignCritic
          # - PathFollowCritic
          # - PathAngleCritic
          # - ConstraintCritic

      progress_checker_plugins: ["progress_checker"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"

      goal_checker_plugins: ["general_goal_checker"]
      general_goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"

bt_navigator:
  ros__parameters:
    global_frame: map 