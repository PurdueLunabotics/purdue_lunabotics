/**/**/global_costmap:
  ros__parameters: 
    height: 5
    width: 5
    publish_frequency: 1.0
    robot_radius: 0.4
    plugins: ["static_layer","denoise_layer", "obstacle_layer" , "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      enabled: true
      map_subscribe_transient_local: false
      subscribe_to_updates: true
      transform_tolerance: 0.1
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: "crater behavior"
      enabled: true
      crater:
        data_type: "PointCloud2"
        obstacle_max_range: 10.0
      behavior:
        data_type: "PointCloud2"
        obstacle_max_range: 10.0
      footprint_clearing_enabled: true
    denoise_layer:
      plugin: "nav2_costmap_2d::DenoiseLayer"
      enabled: true
      minimal_group_size: 3
      group_connectivity_type: 8 # 4 is adjacent, 8 includes diagonals
      footprint_clearing_enabled: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 1.5
      cost_scaling_factor: 6.0
      inflate_unknown: true  # should treat unknown as obstacles (maybe change init values)
      inflate_around_unknown: true
      footprint_clearing_enabled: true

global_costmap:
  global_costmap:
    ros__parameters: 
      global_frame: "map"
      robot_base_frame: "base_link"
      static_layer:
        map_topic: "/rtabmap/map"
      obstacle_layer:
        crater:
          topic: "/rtabmap/crater"
        behavior:
          topic: "/obstacle"

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      # --- General / Costmap Plug Settings ---
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true                
      max_iterations: 1000000             
      max_on_approach_iterations: 1000    
      terminal_checking_interval: 5000     
      max_planning_time: 3.5              

      # --- Search Space & Kinematics ---
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 0.4
      angle_quantization_bins: 72         
      cost_travel_multiplier: 2.0         

      #Causes Issues with path (specifically analytic_expansion_max_cost: 200)
      # --- Analytic Expansion ---
      # analytic_expansion_max_length: 3.0    
      # analytic_expansion_ratio: 3.5       
      # analytic_expansion_max_cost: 200   
      # analytic_expansion_max_cost_override: true 

      # --- Path Penalties ---
      cost_penalty: 2.0                   
      reverse_penalty: 2.1                
      change_penalty: 0.0                 
      non_straight_penalty: 1.10          
      retrospective_penalty: 0.025        
      rotation_penalty: 5.0               

      # --- Caching & Troubleshooting ---
      lookup_table_size: 20.0               
      cache_obstacle_heuristic: True      
      allow_reverse_expansion: False      
      debug_visualizations: True                

      # --- Path Smoothing ---
      smooth_path: True                   
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true               


      

