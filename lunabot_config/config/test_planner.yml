/local_costmap/local_costmap:
  ros__parameters:
    global_frame: map
    height: 3
    width: 3
    rolling_window: true
    robot_radius: 0.4
    resolution: 0.05
    plugins:
    - static_layer
    - denoise_layer
    - inflation_layer
    static_layer:
      enabled: true
      plugin: nav2_costmap_2d::StaticLayer
    denoise_layer:
      enabled: true
      group_connectivity_type: 8
      minimal_group_size: 3
      plugin: nav2_costmap_2d::DenoiseLayer
    inflation_layer:
      cost_scaling_factor: 6.0
      enabled: true
      inflate_around_unknown: true
      inflate_unknown: true
      inflation_radius: 1.5
      plugin: nav2_costmap_2d::InflationLayer

/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    min_theta_velocity_threshold: 0.0001
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    odom_topic: odom
    controller_plugins:
    - FollowPath
    FollowPath:
      angular:
        d: 0.0
        i: 0.0
        max_output: 0.5
        p: 2.0
      angular_inner_tolerance: 0.075
      angular_outer_tolerance: 0.15
      linear:
        d: 0.0
        i: 0.0
        max_output: 0.5
        p: 2.0
      linear_tolerance: 0.2
      plugin: lunabot_nav::PointToPointController
    goal_checker_plugins:
    - goal_checker
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      symmetric_yaw_tolerance: false
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    progress_checker_plugins:
    - progress_checker
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    publish_zero_velocity: true
    speed_limit_topic: speed_limit

/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      costmap_exponential: 2.0
      driving_cost: 1.0
      max_goal_adjustment_meters: 0.75
      node_cost: 2.0
      plugin: lunabot_nav::SThetaStarPlanner
      remapping_cost_change_percent: 0.01
      traversal_cost: 20.0
      turning_cost: 1.2

/global_costmap/global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: "base_link"
    height: 5
    width: 5
    robot_radius: 0.4
    plugins:
    - static_layer
    - denoise_layer
    - inflation_layer
    static_layer:
      enabled: true
      plugin: nav2_costmap_2d::StaticLayer
    denoise_layer:
      enabled: true
      group_connectivity_type: 8
      minimal_group_size: 3
      plugin: nav2_costmap_2d::DenoiseLayer
    inflation_layer:
      cost_scaling_factor: 6.0
      enabled: true
      inflate_around_unknown: true
      inflate_unknown: true
      inflation_radius: 1.5
      plugin: nav2_costmap_2d::InflationLayer

/bt_navigator:
  ros__parameters:
    global_frame: map
    use_sim_time: false

