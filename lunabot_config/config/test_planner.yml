global_costmap:
  global_costmap:
    ros__parameters: 
      height: 5
      width: 5
      publish_frequency: 1.0
      update_frequency: 1.0
      always_send_full_costmap: true
      robot_radius: 0.4
      plugins: ["static_layer","denoise_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8 # 4 is adjacent, 8 includes diagonals
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.5
        cost_scaling_factor: 6.0
        inflate_unknown: true  # should treat unknown as obstacles (maybe change init values)
        inflate_around_unknown: true
        footprint_clearing_enabled: true
      global_frame: "map"
      robot_base_frame: "base_link"

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      minimum_turning_radius: 0.4
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_factor: 72
      analytic_expansion_max_length: 3.0
      allow_unknown: true
      cost_penalty: 2.0
