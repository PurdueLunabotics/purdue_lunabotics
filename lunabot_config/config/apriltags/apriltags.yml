/*:
  apriltag:                 # node name
    ros__parameters:
      image_transport: raw  # image format: "raw" or "compressed"
      family: 36h11         # tag family name: 16h5, 25h9, 36h11
      size: .1905             # default tag edge size in meter
  
  # (optional) list of tags
    # If defined, 'frames' and 'sizes' must have the same length as 'ids'.
      tag: # 368 for sim, 126 IRL
        ids:    [126, 7, 301, 173, 301]         # tag IDs for which to publish transform 
        frames: ["main_deposition", "tag36h11:7", "tag36h11:11", "main_deposition_small", "tag36h11:301"]   # frame names
        sizes:  [0.09603, 0.1905, 0.1905, 0.02, 0.145]     # tag-specific edge size, overrides the default 'size'
/mini/*:
  apriltag:                 # node name
    ros__parameters:
      image_transport: raw  # image format: "raw" or "compressed"
      family: 36h11         # tag family name: 16h5, 25h9, 36h11
      size: .1905             # default tag edge size in meter
  
  # (optional) list of tags
    # If defined, 'frames' and 'sizes' must have the same length as 'ids'.
      tag: # 368 for sim, 126 IRL
        ids:    [126, 7, 11, 173, 301]         # tag IDs for which to publish transform
        frames: ["main_deposition", "tag36h11:107", "tag36h11:111", "main_deposition_small", "tag36h11:401"]   # frame names
        sizes:  [0.09603, 0.1905, 0.1905, 0.02, 0.145]     # tag-specific edge size, overrides the default 'size'
